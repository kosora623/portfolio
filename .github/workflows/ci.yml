# main へのプッシュとプルリクエストで、lint・型チェック・テスト・ビルドを行う
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      # 本番と同じく SITE_URL を付けてビルドする（sitemap・canonical・og:url が出力される）
      - run: npm run build
        env:
          SITE_URL: https://kosora623.com
